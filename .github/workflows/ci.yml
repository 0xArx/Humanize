name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HUMANIZE_NO_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: python -m pip install --quiet pillow
      - run: python -m unittest discover -s tests -v
      - run: python humanize.py doctor
        env: { HUMANIZE_HOME: "${{ runner.temp }}/humanize-home" }
